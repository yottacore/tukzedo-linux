## Initrd only. Installed by the 99tkz-zfs-import dracut module as zfs-import-scan.service.d/tkz-nonfatal.conf.
## tkz-zfs-import-root.service imports the root pool before this unit runs. But the stock zfs-load-key.sh
## pre-mount hook gives up on ZFS key loading if it sees this unit failed, and 'zpool import' exits 1 when
## any pool fails to import, such as an external one another host had last.
[Service]
SuccessExitStatus=1
