## Initrd only. Installed by the 99tkz-zfs-import dracut module as zfs-import-scan.service.d/tkz-nonfatal.conf.
## A failed stock scan isn't the end, since tkz-zfs-import-root.service retries after it. But the stock
## zfs-load-key.sh pre-mount hook gives up on ZFS key loading if it sees this unit failed. 'zpool import'
## exits 1 when a pool fails to import.
[Service]
SuccessExitStatus=1
