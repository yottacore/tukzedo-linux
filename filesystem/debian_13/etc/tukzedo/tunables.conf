##	Purpose:
##		- The one place to set Tukzedo's kernel and system tunables. Applied on every boot by
##		  'tkz-apply-tunables.service', and used to generate the native drop-in files (see below).
##	Usage:
##		tkz_apply-tunables                ## Apply everything here, right now.
##		tkz_apply-tunables --check        ## Report anything whose live value differs from this file.
##		tkz_apply-tunables --emit-native  ## (Re)generate the native drop-ins from this file.
##	Notes:
##		- Edit this file, never the generated ones. Anything under these paths is overwritten:
##			/etc/sysctl.d/60-tkz-tunables.conf
##			/etc/modprobe.d/tkz-tunables.conf
##			/etc/udev/rules.d/60-tkz-tunables.rules
##		- Format: '[section]' headers, then 'key = value'. '#' or '##' starts a comment. Values are
##		  written verbatim, so no quoting is needed (or wanted).
##	History:
##		- 20260813 JC: Created, consolidating '/etc/rc.localx9.d/010-set-kernel-params' (now retired
##		  to 'legacy/') and the hand-maintained ZFS options that duplicated it.


##•••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
##	Kernel sysctls. Generated into '/etc/sysctl.d/', so 'sysctl --system' reproduces them.
##•••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
[sysctl]

## How swap-happy the kernel is. Default 60; higher = swappier; lower usually feels better on a desktop.
vm.swappiness                 = 50

## Preference for reclaiming inode/dentry cache over other caches. Default 100; 50 favors desktop feel.
vm.vfs_cache_pressure         = 50

## How often the kernel wakes to write back dirty data. Default 500 (5s).
vm.dirty_writeback_centisecs  = 200

## How long dirty data may sit in RAM before writeback. Default 3000 (30s); lower avoids long stalls.
vm.dirty_expire_centisecs     = 400

## Path MTU probing. Should be on for modern networks. Default 0.
net.ipv4.tcp_mtu_probing      = 1


##•••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
##	Loadable-module parameters. Generated into '/etc/modprobe.d/'.
##	Changes here reach early boot only after the initrd is rebuilt ('tkz_rebuild-uki'). Until then,
##	'tkz-apply-tunables.service' applies them later in the boot.
##•••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
[module zfs]

## Maximum ARC (cache) size, in bytes. Suffixes like 'G' are not accepted here. See the sizing table below.
zfs_arc_max            = 2147483648

## Disable speculative prefetch, so "this might be needed" doesn't compete with metadata caching.
zfs_prefetch_disable   = 1

## The old '/etc/modprobe.d/zfs.conf' asked for these, but they never took effect, since the generic
## initrd left out '/etc/modprobe.d/' and the initrd loads 'zfs'. Left commented out, because turning
## them on would change behavior. (Moot until the pool has an L2ARC device.)
#l2arc_norw            = 1     ## Live default: 0
#l2arc_feed_secs       = 0     ## Live default: 1

## Also dropped from that file: 'zfs_mdcomp_disable', which no longer exists in this OpenZFS at all.

## ARC sizing guidance:
##	  GB RAM     For ZFS     zfs_arc_max=     % RAM
##	  -------    -------     ------------     -----
##	      4        2.0        2147483648       50%
##	      8        2.0        2147483648       25%
##	     16        4.0        4294967296       25%
##	     32        8.0        8589934592       25%
##	     64       16.0       17179869184       25%
##	    128       32.0       34359738368       25%


##•••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
##	Built-in (non-module) kernel parameters.
##	'zswap' is built into the kernel, so '/etc/modprobe.d/' can't apply to it. These belong on the kernel
##	command line, in '/etc/kernel/uki-cmdline.conf'. They're writable at runtime, so they're applied here
##	too, and 'tkz_apply-tunables --emit-native' prints the cmdline entry to add.
##•••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
[module zswap]

## Percentage of RAM zswap may use for the compressed pool. Default 20.
max_pool_percent       = 33


##•••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
##	Per-block-device settings. Generated into a udev rule, so they reapply on hotplug.
##	Device classes, most specific first: 'nvme', 'rotational', 'nonrotational'.
##•••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••••
[block]

## NVMe: 'none' is usually best; the device's own queueing beats anything the kernel can add.
nvme           scheduler = none

## Spinning disks. The retired script asked for 'deadline', which modern kernels alias to 'mq-deadline';
## named explicitly here. 'bfq' is often better for desktop interactivity, at some throughput cost.
rotational     scheduler = bfq

## SSDs, and most USB HDDs, which claim to be non-rotational. So bfq rather than 'none', in case it's
## really a spinning disk behind a USB bridge.
## Note that bfq is a loadable module here, so the applier modprobes it on demand.
nonrotational  scheduler = bfq
