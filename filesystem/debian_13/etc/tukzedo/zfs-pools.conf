## Read by tkz_zfs-import, which tkz-zfs-import.service runs early in boot.
##
## Pools listed here get imported with retries, and force-imported if another host had them last.
## List only pools whose disks are always attached. A listed pool that's missing holds up the boot
## for IMPORT_TIMEOUT seconds, then the unit fails.
##
## Don't list the root pool. The initrd imports it, from root=ZFS= on the kernel command line.
## Pools not listed, such as external disks, are still imported by the stock zfs-import-scan.service,
## but never forced.

ZFS_POOLS=()
#ZFS_POOLS=( zf10_xxxxx zf20_xxxxx )

## Seconds to keep retrying the listed pools.
IMPORT_TIMEOUT=30
