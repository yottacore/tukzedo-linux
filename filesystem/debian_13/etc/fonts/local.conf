<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Tukzedo: Mona Sans for the interface, Monaspace Argon for fixed width. -->
<fontconfig>
	<alias>
		<family>sans-serif</family>
		<prefer><family>Mona Sans</family></prefer>
	</alias>
	<alias>
		<family>monospace</family>
		<prefer><family>Monaspace Argon</family></prefer>
	</alias>
</fontconfig>
