; Tukzedo default: a calm dark look. The Tukzedo Dark LXQt theme, Breeze dark icons, Fusion with a muted
; blue-gray palette, and Mona Sans. Users can change all of it in LXQt Appearance.
[General]
theme=tukzedo-dark
icon_theme=breeze-dark
single_click_activate=false
tool_button_style=ToolButtonTextBesideIcon
palette_override=true

[Palette]
window_color=#1e2128
window_text_color=#e5e9f0
base_color=#23262e
text_color=#d8dee9
highlight_color=#4c6a92
highlighted_text_color=#ffffff
link_color=#88c0d0
link_visited_color=#b48ead
tooltip_base_color=#2b2f38
tooltip_text_color=#e5e9f0

[Qt]
font="Mona Sans,10,-1,5,50,0,0,0,0,0"
doubleClickInterval=400
style=Fusion
wheelScrollLines=3
