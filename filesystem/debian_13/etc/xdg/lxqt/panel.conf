; Tukzedo default: LXQt's own default panel, with the file manager, terminal and editor in quick launch, and less 'desktopswitch' (shows 'n/a' on Wayfire, which gives it no workspaces) and 'tray' (X11 only; 'statusnotifier' covers Wayland).
panels=panel1

[panel1]
plugins=fancymenu,quicklaunch,taskbar,statusnotifier,mount,volume,worldclock,showdesktop
position=Bottom
desktop=0

[fancymenu]
type=fancymenu
alignment=Left
filterClear=true
autoSel=true
autoSelDelay=150

[desktopswitch]
type=desktopswitch

[quicklaunch]
type=quicklaunch
alignment=Left
apps\1\desktop=/usr/share/applications/pcmanfm-qt.desktop
apps\2\desktop=/usr/share/applications/qterminal.desktop
apps\3\desktop=/usr/share/applications/featherpad.desktop
apps\size=3

[taskbar]
type=taskbar
buttonWidth=220
closeOnMiddleClick=true
groupingEnabled=false

[mount]
type=mount

[worldclock]
type=worldclock

[volume]
device=0
type=volume

[showdesktop]
alignment=Right
type=showdesktop

[statusnotifier]
alignment=Right
type=statusnotifier

[tray]
type=tray
